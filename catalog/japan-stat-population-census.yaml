notes: |
  Human-verified 2026-10-31: HTTP 200. The English page "Population Census" lists sections for the 2025, 2020, 2015, 2010 and 2005 censuses. The 2025 section shows the outline, explanation of terms and questionnaire; "Summary of the results and statistical tables" appears under 2020 and earlier, so 2020 is the latest round with results linked from this page. The census runs every five years, which the schema can't express, so cadence is irregular. Full tables are disseminated through e-Stat (www.e-stat.go.jp), which wasn't probed. The xlsx format and the geography levels are assumed and weren't checked.
  Licence checked 2026-10-31: the site's "Information for use of this Website" page (https://www.stat.go.jp/english/info/riyou.html) says content may be copied and modified, "Commercial use of Content is also permitted", and "numerical data and data in Simple tables, graphs, and so forth are not subject to copyright. Accordingly the terms of use does not apply to such data, and said data may be used freely." It adds "The Terms of Use was established on March 7, 2025. The Terms of Use is based on the Public Data License (Version 1.0)" and "The Terms of Use are compatible with the Creative Commons Attribution License 4.0". The source-citation example is the basis of the attribution string.
