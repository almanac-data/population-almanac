notes: |
  Human-verified 2026-10-31: HTTP 200 (curl with a browser user agent). The page "International Database: World Population Estimates and Projections" lists access via the "International Database web tool", the "IDB Application Programming Interface (API)", and "Download the entire dataset". It says "The IDB was last updated in December 2025. The next update is planned for November 2026" and "We have produced these data since the 1960s". The country count, the projection horizon and the formats weren't checked. Cadence is annual going by the December 2025 and November 2026 dates.
  Licence checked 2026-10-31: no data licence is stated on the page. The Census Bureau is a federal agency and its works are not copyrightable under 17 U.S.C. 105. The citation policy (https://www.census.gov/about/policies/citation.html) asks users to "cite the Census Bureau as the source of the original data".
