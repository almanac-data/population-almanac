notes: |
  Human-verified 2026-10-31: HTTP 200. The page reads "Annual population estimates. Figures are available for various administrative and electoral geographies and for different population sub-groups, for example, estimates of the very old and estimates by marital status." Its spotlight is "Population estimates for the UK, England, Wales, Scotland and Northern Ireland: mid-2025", saying "The population of the UK continued to grow in the year to mid-2025, reaching an estimated 69.5 million people." This topic page covers estimates only; ONS Census 2021 results and national population projections sit on sibling pages and aren't separately cataloged. Formats and start years weren't checked.
  Licence checked 2026-10-31: the page footer says "All content is available under the Open Government Licence v3.0, except where otherwise stated", and the ONS terms and conditions (https://www.ons.gov.uk/help/termsandconditions, last updated 8 May 2026) say "Most content on this website is subject to Crown copyright protection and is published under the Open Government Licence (OGL). Some content is exempt from the OGL". That is a site-wide statement, not a dataset-specific one.
