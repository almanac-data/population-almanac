notes: |
  Human-verified 2026-10-31: HTTP 200. The portal is a JavaScript app (plain curl returns only the title "Statistics South Africa | Census Dissemination"), so it was read in headless Chromium, which landed on https://census.statssa.gov.za/#/. It reads "Welcome to the official Stats SA Census Portal" and "Census 2022 was the first digital population count", shows "Total population: 62 027 503" and "Number of households: 17 828 778", and has year tabs for 2022, 2011, 2001 and 1996 plus "Stats by Location" and "Stats by Theme". The Census 2022 statistical release P0301.4 is served at https://census.statssa.gov.za/assets/documents/2022/P03014_Census_2022_Statistical_Release.pdf (HTTP 200; its cover says "Embargoed until: 10 October 2023"); that URL was fetched directly, and its link from the portal wasn't traced. Downloadable tables, the geography levels and any API weren't checked.
  Licence checked 2026-10-31: no licence or terms text was found on the portal, and the release PDF's front matter yielded no copyright text to pdftotext. Stats SA's Work Programme 2026/27 (https://www.statssa.gov.za/strategy_plan/Work_Programme_2026_27.pdf) carries the agency's standard notice: "Users may apply or process this data, provided Statistics South Africa (Stats SA) is acknowledged as the original source of the data; that it is specified that the application and/or analysis is the result of the user’s independent processing of the data; and that neither the basic data nor any reprocessed version or application thereof may be sold or offered for sale in any form whatsoever without prior permission from Stats SA." That's a publication notice, not a census-data licence, so the licence stays unverified.
