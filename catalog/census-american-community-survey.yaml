id: census-american-community-survey
type: dataset
title: U.S. Census Bureau American Community Survey (ACS)
description: |
  The Census Bureau's ongoing annual household survey producing detailed social, economic, housing and demographic estimates (1-year and 5-year) for the US and Puerto Rico, down to block groups for 5-year data. The main US source for population characteristics between censuses.
