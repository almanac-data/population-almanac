notes: |
  Human-verified 2026-10-31: HTTP 200 (curl with a browser user agent). The page "Population and Housing Unit Estimates" says "The Census Bureau's Population Estimates Program (PEP) produces estimates of the population for the United States, states, metropolitan and micropolitan statistical areas, counties, cities, towns, as well as for Puerto Rico and its municipios." A June 9, 2026 press release mentions a media embargo for "Vintage 2025 Population Estimates", and the page notes "Intercensal estimates are produced once every 10 years after the decennial census". The demographic breakdowns, the formats and API availability are from general knowledge and weren't checked.
  Licence checked 2026-10-31: no data licence is stated on the page. The Census Bureau is a federal agency and its works are not copyrightable under 17 U.S.C. 105. The citation policy (https://www.census.gov/about/policies/citation.html) asks users to "cite the Census Bureau as the source of the original data".
